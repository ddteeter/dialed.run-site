name: Deploy

# Builds from the real guide artifact and the pinned legal texts, then
# deploys the static site to Cloudflare. Runs on every push to main and
# nightly, which picks up fresh guide data.
#
# Held until the owner sets the repository variable DEPLOY_ENABLED to
# "true", so creating the GitHub repo can't deploy anything by itself.
# See docs/deploy.md for the variables and the two secrets.
on:
  push:
    branches: [main]
  schedule:
    # After the app's nightly artifact (03:00 UTC).
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue; one is never cancelled halfway through a publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
      LEGAL_SOURCE_REF: ${{ vars.LEGAL_SOURCE_REF }}
      INVITE_ENDPOINT: ${{ vars.INVITE_ENDPOINT }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      GOATCOUNTER_ENDPOINT: ${{ vars.GOATCOUNTER_ENDPOINT }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test

      # A read-only R2 key scoped to the artifact's bucket. The deploy token
      # below has no R2 access, and this key has nothing but read.
      - name: Download the guide artifact from R2
        run: |
          aws s3 cp "s3://$BUCKET/$KEY" "$GUIDE_ARTIFACT_FILE" \
            --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com" --no-progress
        env:
          # The runner context exists only at step level, not in job env.
          GUIDE_ARTIFACT_FILE: ${{ runner.temp }}/guide-artifact.json
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.GUIDE_ARTIFACT_BUCKET }}
          KEY: ${{ vars.GUIDE_ARTIFACT_KEY }}

      # Fails on a missing or invalid artifact, an unknown artifact version,
      # a band under 5 runners, or a published legal text it can't draw.
      - run: npm run build
        env:
          GUIDE_ARTIFACT_FILE: ${{ runner.temp }}/guide-artifact.json

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Smoke-test the live site
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w '%{http_code}' https://dialed.run/)
          test "$status" = 200
          if [ "$SITE_INDEXABLE" != "true" ]; then
            curl -sI https://dialed.run/ | grep -qi '^x-robots-tag: noindex'
          fi

      - name: Open an issue when the nightly build fails
        if: ${{ failure() && github.event_name == 'schedule' }}
        run: |
          gh issue create --title "Nightly deploy failed" \
            --body "The nightly build or deploy failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
