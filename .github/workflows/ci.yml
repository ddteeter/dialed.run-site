name: CI

# Every PR, and every push to main: the fixture build, the unit and dist
# tests, the link check, the Playwright smoke and axe suite, and
# Lighthouse. No secrets are used or needed. main doesn't require a PR to
# be up to date before it merges, so Dependabot's PRs can merge unattended;
# the push run is what tests two merges together.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR, or to main, supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      USE_FIXTURE_DATA: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Action pins name the commits their tags point at
        run: node .github/scripts/verify-action-pins.mjs --online
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A workflow file GitHub can't parse fails without ever running a job,
      # and nothing on the PR would say so. actionlint, pinned to a release.
      - name: Lint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build:fixture
      - run: npm run test:dist

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          fail: true

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lighthouse

      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          retention-days: 7
