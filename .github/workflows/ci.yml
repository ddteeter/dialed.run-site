name: CI

# Every PR: the fixture build, the unit and dist tests, the link check,
# the Playwright smoke and axe suite, and Lighthouse. No secrets are used
# or needed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      USE_FIXTURE_DATA: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Action pins name the commits their tags point at
        run: node .github/scripts/verify-action-pins.mjs --online
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build:fixture
      - run: npm run test:dist

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          fail: true

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lighthouse

      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          retention-days: 7
